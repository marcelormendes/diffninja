name: consumer-matrix

# Pre-release consumer verification: pack once, then install the tarball the
# way a real user would on every supported platform and exercise the installed
# surface (CLI report, --open, native + on-demand grammar extraction, MCP
# stdio). This is the hosted proof that `npm install -g diffninja` works on
# Windows and macOS, not just Linux.
#
# Runs on pull requests and on demand. The release workflow keeps its own
# install matrix as the publish gate; this workflow is the wider pre-release
# check, including Linux ARM64 (mislabeled prebuilds are repaired in the
# grammar cache by building from source, which needs the toolchain below).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination dist-pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: dist-pack/*.tgz

  consume:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball
          path: dist-pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Linux ARM64: the tree-sitter-typescript/javascript prebuilds ship
      # x86-64 bytes as linux-arm64. diffninja detects the mismatch and
      # rebuilds from source in its grammar cache, which needs a toolchain.
      - name: Install build toolchain (Linux ARM64)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Verify packaged consumer surface
        run: node scripts/verify-package.mjs dist-pack
